<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Möten, statistik</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#0A5A46}a:hover{color:#0E7A5F}
.sida{--bg:#EEF1EC;--surface:#FBFCFA;--surface-2:#F0F4EE;--line:#DCE3DA;--line-2:#C3CEC2;--ink:#13201C;--ink-2:#47554F;--ink-3:#5F6C66;--brand:#0E7A5F;--brand-2:#74BCA4;--brand-soft:#DDEFE6;--brand-ink:#0A5A46;--signal:#D98A1C;--signal-soft:#FBEBD0;--signal-ink:#7A4A06;--danger:#C4473C;--danger-soft:#F8E1DD;--danger-ink:#8C2C24;--hub:#0F2A22;--hub-line:rgba(220,245,232,.16);--hub-ink:#EAF4EE;--hub-ink-2:#A8C2B6;--hub-ink-3:#8FAA9F;--hub-brand:#4FD1A5;--hub-danger:#E5675B;--scrim:rgba(15,42,34,.34);--ease:cubic-bezier(.2,.8,.2,1);--f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--f-body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;padding:26px clamp(16px,2.8vw,40px) 28px;min-height:100vh;box-sizing:border-box}
.sida.dark{--bg:#0B1210;--surface:#111A17;--surface-2:#18231F;--line:#22302B;--line-2:#3A4B44;--ink:#E5EEE9;--ink-2:#A6B5AE;--ink-3:#8B9A93;--brand:#3FC79A;--brand-2:#23785F;--brand-soft:#15302A;--brand-ink:#7FE0BE;--signal:#F0B04F;--signal-soft:#33270F;--signal-ink:#F6CB86;--danger:#EE7B6F;--danger-soft:#371B18;--danger-ink:#F5A79E;--hub:#0F201B;--scrim:rgba(0,0,0,.55)}
.sida *{box-sizing:border-box}
.sida button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer}
.sida button:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.sida p,.sida h1,.sida h2{margin:0;padding:0}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.in{animation:upp .5s var(--ease) both}
@keyframes upp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes vax{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes resa{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes glid{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes ton{from{opacity:0}to{opacity:1}}
.sida .ok{background:var(--brand)}.sida .ok2{background:var(--brand-2)}.sida .varn{background:var(--signal)}.sida .fara{background:var(--danger)}.sida .vag{background:var(--ink-3)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}

/* Huvudet: en mening om läget, personen och perioden */
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px 24px;flex-wrap:wrap;margin-bottom:6px}
.eb{font-size:12px;letter-spacing:.05em;text-transform:uppercase;font-weight:500;color:var(--ink-3)}
.ins{flex:1 1 100%;font:600 clamp(21px,2.1vw,27px)/1.22 var(--f-display);letter-spacing:-.02em;text-wrap:pretty}
.i2{font-weight:500;color:var(--ink-2)}
.ctl{display:flex;gap:8px;flex-wrap:wrap;max-width:100%}
.seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);max-width:100%;overflow-x:auto}
.seg button{min-height:34px;padding:0 12px;border-radius:8px;font-size:13px;color:var(--ink-2);white-space:nowrap;transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.sida .seg button:focus-visible{outline-offset:-2px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:550;box-shadow:0 1px 2px rgba(19,32,28,.14)}

/* Rutnätet: ett nav och små rutor. Varje ruta är en etikett, ett tal och en mätare. */
.bento{display:grid;grid-template-columns:minmax(0,1.7fr) repeat(3,minmax(0,1fr));grid-auto-rows:minmax(216px,auto);grid-auto-flow:dense;gap:18px}
.sida .ruta{display:flex;flex-direction:column;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px 22px 22px;transition:border-color .15s}
.sida button.ruta:hover{border-color:var(--line-2)}
.sida button.ruta:focus-visible{border-radius:24px}
.rl{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;font-size:14px;font-weight:500;line-height:1.35;color:var(--ink-2)}
.rl>svg{width:16px;height:16px;flex:none;margin-top:1px;color:var(--ink-3);transition:color .15s,transform .15s var(--ease)}
button.ruta:hover .rl>svg{color:var(--ink);transform:translate(1px,-1px)}
.rv{display:block;margin-top:auto;padding-top:12px;font:600 46px/1.08 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.035em;white-space:nowrap}
.rv>small,.hv>small{font:500 .42em/1 var(--f-body);letter-spacing:0;margin-left:.16em;color:var(--ink-2)}
.rv.txt{font-size:34px;line-height:1.46;letter-spacing:-.03em}
.rv.tom{color:var(--ink-3)}
.rt{display:block;min-height:58px;margin-top:3px}
.rs{display:block;font-size:13.5px;line-height:1.45;color:var(--ink-2)}
.rn{display:block;font-size:12.5px;line-height:1.45;color:var(--ink-3)}
.mt{display:block;height:6px;border-radius:3px;background:var(--surface-2);margin-top:12px;overflow:hidden}
.mt>i,.split>i{display:block;height:100%;border-radius:3px;transform-origin:left;animation:vax .9s var(--ease) .25s both;transition:width .7s var(--ease)}

/* Navet: show rate, och mötena ett och ett i tidsordning */
.sida .hero{grid-row:span 2;background:var(--hub);border-color:var(--hub-line);color:var(--hub-ink);padding:24px 26px}
.sida button.hero:hover{border-color:rgba(220,245,232,.36)}
.sida button.hero:focus-visible{outline-color:var(--hub-brand)}
.sida.dark .hero{border-color:rgba(79,209,165,.32)}
.hero .rl{color:var(--hub-ink-2)}
.hero .rl>svg{color:var(--hub-ink-3)}
button.hero:hover .rl>svg{color:var(--hub-ink)}
.hv{display:block;margin-top:20px;font:600 clamp(84px,8.2vw,112px)/1 var(--f-display);font-variation-settings:"opsz" 96;font-variant-numeric:tabular-nums;letter-spacing:-.045em;white-space:nowrap}
.hv>small{font-size:.34em;color:var(--hub-ink-2)}
.hv.txt{font-size:clamp(56px,5.4vw,72px);line-height:1.3}
.hv.tom{font-size:64px;line-height:1.3;color:var(--hub-ink-3)}
.hs{display:block;font-size:15px;margin-top:10px}
.hj{display:block;font-size:13px;color:var(--hub-ink-2);margin-top:2px}
.rem{display:block;margin-top:auto;padding-top:22px}
.remsa{display:flex;height:68px;position:relative}
.remsa::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--hub-line)}
.remsa>i{display:block;flex:0 1 34px;min-width:0;height:calc(50% - 3px);position:relative}
.remsa>i::after{content:"";position:absolute;left:0;top:0;bottom:0;width:min(6px,calc(100% - 2px));border-radius:3px;animation:resa .5s var(--ease) both;animation-delay:inherit}
.remsa>.k{align-self:flex-start}.remsa>.k::after{background:var(--hub-brand);transform-origin:bottom}
.remsa>.u{align-self:flex-end}.remsa>.u::after{background:var(--hub-danger);transform-origin:top}
.rc{display:flex;justify-content:space-between;align-items:center;gap:6px 14px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--hub-ink-2)}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg>i{display:inline-block;width:4px;height:10px;border-radius:1.5px}
.lg>.k{background:var(--hub-brand)}.lg>.u{background:var(--hub-danger);margin-left:8px}

/* Efter första mötet: till offert störst, resten bredvid */
.sida .eft{grid-column:span 2}
.eg{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:10px;margin-top:auto;padding-top:10px}
.sida .ec{display:flex;flex-direction:column;min-width:0;padding:6px 8px 4px;margin:-6px -8px -4px;border-radius:12px;transition:background .15s}
.sida .ec:hover{background:var(--surface-2)}
.el{display:flex;align-items:center;gap:7px;font-size:13.5px;line-height:1.35;color:var(--ink-2);white-space:nowrap}
.en{display:flex;align-items:flex-end;height:50px;margin-top:4px;padding-bottom:3px;font:600 30px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.forst .en{font-size:46px;padding-bottom:0;letter-spacing:-.035em}
.noll .en{color:var(--ink-3)}
.es{display:block;font-size:13.5px;line-height:1.45;color:var(--ink-2);min-height:20px;margin-top:3px}
.split{display:flex;gap:2px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:12px}

/* Att göra nu: en remsa, läget i dag */
.gora{display:grid;grid-template-columns:132px minmax(0,1fr);gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:12px 16px 12px 22px}
.gl{font-size:14px;font-weight:500;color:var(--ink-2)}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:2px 6px}
.sida .gi{display:grid;grid-template-columns:auto minmax(0,1fr) 14px;gap:0 12px;align-items:center;min-height:60px;padding:8px 10px;border-radius:14px;transition:background .15s}
.sida .gi:hover{background:var(--surface-2)}
.gi>b{grid-row:1 / span 2;min-width:28px;font:600 28px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.gt{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:550;line-height:1.35}
.gi>small{grid-column:2;font-size:12.5px;line-height:1.4;color:var(--ink-3)}
.gi>svg{grid-row:1 / span 2;grid-column:3;width:14px;height:14px;color:var(--ink-3)}
.lugnt{grid-column:1 / -1;font-size:13.5px;color:var(--ink-3);padding:19px 10px}

/* Bladet med raderna bakom ett tal */
.sida .scrim{position:fixed;inset:0;background:var(--scrim);animation:ton .2s both;cursor:default}
.blad{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-24px 0 64px -24px rgba(10,30,24,.45);padding:20px 22px 0;display:flex;flex-direction:column;animation:glid .3s var(--ease) both;outline:0}
.bh{display:flex;align-items:flex-start;gap:12px}
.bh h2{font:600 21px/1.2 var(--f-display);letter-spacing:-.015em}
.sida .bx{margin:-8px -10px 0 auto;display:grid;place-items:center;width:44px;height:44px;border-radius:10px;flex:none}
.sida .bx:hover{background:var(--surface-2)}
.bx>svg{width:16px;height:16px}
.bf{font-size:13px;line-height:1.5;color:var(--ink-2);margin-top:6px!important}
.ba{font-size:12.5px;color:var(--ink-3);margin:12px 0 6px!important}
.bl{overflow:auto;flex:1;margin:0 -22px;padding:0 22px 22px}
.br{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.br>b{font-weight:550;overflow-wrap:anywhere}
.nar{font-size:12.5px;color:var(--ink-2);grid-column:1}
.br>small{grid-column:1 / -1;font-size:12px;color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:550;padding:2px 8px;border-radius:6px;white-space:nowrap;grid-row:1;grid-column:2}
.sida .pill.ok{background:var(--brand-soft);color:var(--brand-ink)}.sida .pill.varn{background:var(--signal-soft);color:var(--signal-ink)}.sida .pill.fara{background:var(--danger-soft);color:var(--danger-ink)}.sida .pill.neutral{background:var(--surface-2);color:var(--ink-2)}
.tomt{font-size:13px;color:var(--ink-3);padding:12px 0}

.fotrad{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}

@media (max-width:1040px){.bento{grid-template-columns:repeat(2,minmax(0,1fr))}.sida .hero{grid-column:span 2;grid-row:auto}.rem{padding-top:28px}}
@media (max-width:1240px){.gora{grid-template-columns:minmax(0,1fr);padding:16px 12px 10px}.gl{padding:0 10px}}
@media (max-width:560px){.bento{gap:12px;grid-auto-rows:minmax(172px,auto)}.sida .ruta{padding:16px 16px 18px;border-radius:20px}.sida .hero{padding:20px}.rv,.forst .en{font-size:40px}.rv.txt{font-size:30px;line-height:1.44}.eg{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 10px}.en{height:44px}.tomrad{display:none}.seg button{min-height:44px}.ctl{width:100%}.gora{border-radius:20px}}
@media (prefers-reduced-motion:reduce){.sida *{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="{{rot}}">
<div class="wrap">

<header class="hd">
<p class="eb">Möten · Statistik</p>
<div class="ctl">
<div class="seg" role="group" aria-label="Person">
<sc-for list="{{personer}}" as="x" hint-placeholder-count="4">
<button type="button" aria-pressed="{{x.tryckt}}" onClick="{{x.pick}}">{{x.l}}</button>
</sc-for>
</div>
<div class="seg" role="group" aria-label="Period">
<sc-for list="{{perioder}}" as="p" hint-placeholder-count="4">
<button type="button" aria-pressed="{{p.tryckt}}" title="{{p.tip}}" onClick="{{p.pick}}">{{p.l}}</button>
</sc-for>
</div>
</div>
<h1 class="ins"><span class="i1">{{ins1}}</span> <span class="i2">{{ins2}}</span></h1>
</header>

<div class="bento">

<button type="button" class="ruta hero in" onClick="{{show.pick}}" aria-label="{{show.aria}}">
<span class="rl">Show rate<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"></path></svg></span>
<span class="{{show.cls}}">{{show.v}}<small>{{show.pz}}</small></span>
<span class="hs">{{show.s}}</span>
<span class="hj">{{show.jf}}</span>
<sc-if value="{{harRemsa}}" hint-placeholder-val="{{true}}">
<span class="rem" aria-hidden="true">
<span class="remsa"><sc-for list="{{remsa}}" as="m" hint-placeholder-count="11"><i class="{{m.cls}}" title="{{m.title}}" style="animation-delay: {{m.delay}}"></i></sc-for></span>
<span class="rc"><span>{{remsaText}}</span><span class="lg"><i class="k"></i>kom<i class="u"></i>uteblev</span></span>
</span>
</sc-if>
</button>

<button type="button" class="ruta in" style="animation-delay: 60ms" onClick="{{noshow.pick}}" aria-label="{{noshow.aria}}">
<span class="rl">No-show rate<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"></path></svg></span>
<span class="{{noshow.cls}}">{{noshow.v}}<small>{{noshow.pz}}</small></span>
<span class="rt"><span class="rs">{{noshow.s}}</span><span class="rn">{{noshow.not}}</span></span>
<span class="mt" aria-hidden="true"><i class="fara" style="width: {{noshow.w}}"></i></span>
</button>

<button type="button" class="ruta in" style="animation-delay: 120ms" onClick="{{bekr.pick}}" aria-label="{{bekr.aria}}">
<span class="rl">Svarade på bekräftelsen<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"></path></svg></span>
<span class="{{bekr.cls}}">{{bekr.v}}<small>{{bekr.pz}}</small></span>
<span class="rt"><span class="rs">{{bekr.s}}</span><span class="rn">{{bekr.not}}</span></span>
<span class="mt" aria-hidden="true"><i class="ok" style="width: {{bekr.w}}"></i></span>
</button>

<button type="button" class="ruta in" style="animation-delay: 180ms" onClick="{{kval.pick}}" aria-label="{{kval.aria}}">
<span class="rl">Kvalificerade<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"></path></svg></span>
<span class="{{kval.cls}}">{{kval.v}}<small>{{kval.pz}}</small></span>
<span class="rt"><span class="rs">{{kval.s}}</span><span class="rn">{{kval.not}}</span></span>
<span class="mt" aria-hidden="true"><i class="ok" style="width: {{kval.w}}"></i></span>
</button>

<section class="ruta eft in" style="animation-delay: 240ms" aria-label="Efter första mötet">
<p class="rl">Efter första mötet</p>
<div class="eg">
<sc-for list="{{eft}}" as="x" hint-placeholder-count="4">
<button type="button" class="{{x.cls}}" onClick="{{x.pick}}" aria-label="{{x.aria}}">
<span class="el"><i class="{{x.dot}}"></i>{{x.l}}</span>
<span class="en">{{x.n}}</span>
<span class="{{x.esCls}}">{{x.sub}}</span>
</button>
</sc-for>
</div>
<div class="split" aria-hidden="true"><sc-for list="{{eft}}" as="s" hint-placeholder-count="4"><i class="{{s.ton}}" style="width: {{s.w}}"></i></sc-for></div>
</section>

<button type="button" class="ruta in" style="animation-delay: 300ms" onClick="{{clo.pick}}" aria-label="{{clo.aria}}">
<span class="rl">Closing rate<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"></path></svg></span>
<span class="{{clo.cls}}">{{clo.v}}<small>{{clo.pz}}</small></span>
<span class="rt"><span class="rs">{{clo.s}}</span><span class="rn">{{clo.not}}</span></span>
<span class="mt" aria-hidden="true"><i class="ok" style="width: {{clo.w}}"></i></span>
</button>

</div>

<section class="gora in" style="animation-delay: 360ms" aria-label="Att göra nu">
<p class="gl">Att göra nu</p>
<div class="gg">
<sc-for list="{{todo}}" as="a" hint-placeholder-count="4">
<button type="button" class="gi" onClick="{{a.pick}}"><b>{{a.n}}</b><span class="gt"><i class="{{a.ton}}"></i>{{a.text}}</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg><small>{{a.sub}}</small></button>
</sc-for>
<sc-if value="{{lugnt}}" hint-placeholder-val="{{false}}"><p class="lugnt">Inget väntar just nu.</p></sc-if>
</div>
</section>

<div class="fotrad"><span>{{fot}}</span>
<div class="seg" role="group" aria-label="Underlag i förhandsvisningen">
<button type="button" aria-pressed="{{egTryckt}}" onClick="{{visaEgna}}">Era siffror</button>
<button type="button" aria-pressed="{{exTryckt}}" onClick="{{visaEx}}">Exempel: ett halvår</button>
</div>
</div>
</div>

<sc-if value="{{bladOppet}}" hint-placeholder-val="{{false}}">
<div>
<button type="button" class="scrim" onClick="{{stang}}" aria-label="Stäng listan" tabindex="-1"></button>
<aside class="blad" role="dialog" aria-modal="true" aria-label="{{blad.titel}}" onKeyDown="{{bladTangent}}">
<div class="bh"><h2>{{blad.titel}}</h2>
<button type="button" class="bx" onClick="{{stang}}" aria-label="Stäng"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>
<p class="bf">{{blad.fork}}</p>
<p class="ba">{{blad.antal}}</p>
<div class="bl">
<sc-if value="{{blad.tom}}" hint-placeholder-val="{{false}}"><p class="tomt">Inga rader i perioden.</p></sc-if>
<sc-for list="{{blad.rader}}" as="r" hint-placeholder-count="6">
<div class="br"><b>{{r.bolag}}</b><span class="{{r.ton}}">{{r.pill}}</span><span class="nar">{{r.nar}}</span><small>{{r.sub}}</small></div>
</sc-for>
</div>
</aside>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"underlag":{"editor":"enum","options":["Era siffror","Exempel: ett halvår"],"default":"Era siffror"},"morkt":{"editor":"boolean","default":false},"$preview":{"width":1360,"height":800}}'>
class Component extends DCLogic {
  /* Förhandsvisning av Möten › Statistik. Allt räknas ur en lista möten och en lista kort (kedjor),
     med samma regler för de riktiga siffrorna och för exempeldatan. */
  init() {
    if (this.cur) return;
    this.cur = {}; this.from = {}; this.t = 1; this.raf = 0;
    this.NU = '2026-11-14T20:30';
  }
  get st() { return Object.assign({ period: 'd90', open: null, pers: null }, this.state || {}); }

    return { bolag: k.namn, nar: 'Möte ' + this.svDag(m.tid, false), pill: P[0], ton: 'pill ' + P[1], sub: (k.uppf && !k.avslut ? 'Uppföljning ' + this.kortDag(k.uppf) + ' · ' : '') + 'Säljare ' + m.hallare, t: m.tid, u: k.uppf || m.tid };
  }
  bekrPill(m) { return m.bekr ? ['Svarade', 'ok'] : m.forsok ? ['Svarade inte', 'varn'] : ['Ringdes aldrig', 'fara']; }
  slutPill(k) { return { affar: ['Affär', 'ok'], nej: ['Nej', 'fara'], tyst: ['Tyst', 'varn'], svar: ['Väntar på svar', 'neutral'] }[k.slut]; }
  lista(key, S, A) {
    const mr = (a, p) => a.map(m => this.moteRad(m, typeof p === 'function' ? p(m) : p)), kr = (a, p) => a.map(k => this.kedjaRad(k, typeof p === 'function' ? p(k) : p));
    const sp = (k) => this.slutPill(k), ja = (f) => { const a = S.hallna.filter(m => m[f] !== null && m[f] !== undefined); return a.filter(m => m[f] === 1).length + ' av ' + a.length; };
    const kom = (a) => a.filter(m => m.utfall === 'h').length + ' av ' + a.length;
    const L = {
      show: () => ['Blev mötet av?', 'Möten som hölls eller där kunden uteblev. Avbokade möten räknas inte.', mr(S.avgj)],
      uteblev: () => ['Uteblev', 'Kunden kom inte till mötet.', mr(S.uteblev)],
      bekr: () => ['Bekräftelsesamtalet', 'Mötena som har varit, efter hur samtalet före mötet gick. ' + (S.svarade.length ? 'Av de som svarade kom ' + kom(S.svarade) + '. ' : '') + (S.obekr.length ? 'Av övriga kom ' + kom(S.obekr) + '. ' : '') + (S.aldrig.length ? 'Ringdes aldrig betyder att varken Bekräfta eller Fick inte tag trycktes före mötet.' : ''), mr(S.avgj, m => this.bekrPill(m))],
      kval: () => ['Kvalificering', 'Säljaren svarar på frågorna efter mötet. Alla ja ger kvalificerat. Rätt beslutsfattare med: ' + ja('bes') + '. Kunden visste vad mötet gällde: ' + ja('syf') + '.', mr(S.hallna, m => m.niva === 'k' ? ['Kvalificerat', 'ok'] : m.niva ? ['Inte kvalificerat', 'varn'] : ['Inte bedömt', 'varn'])],
      offert: () => ['Till offert', 'Kort där en offert har skickats efter mötet, eller där det blev affär direkt.', kr(S.off, sp)],
      nytt: () => ['Nytt möte bokat', 'Ingen offert än, men ett nytt möte är bokat.', kr(S.nytt)],
      vantar: () => ['Följs upp', 'Mötet hölls och ska följas upp. Varken offert eller nytt möte än.', kr(S.vantar)],
      dog: () => ['Dog efter första mötet', 'Nej eller tyst, utan offert och utan nytt möte.', kr(S.dog)],
      closing: () => ['Offerterna', 'Closing rate är affärerna delat med de offerter som har fått ett ja eller ett nej.', kr(S.off, sp)],
      svarnu: () => ['Offerter som väntar på svar', 'Alla offerter som är ute i dag, oavsett period.', kr(A.offsvar, k => k.uppf && k.uppf < this.dag(this.NU) ? ['Skulle följts upp', 'fara'] : ['Väntar på svar', 'neutral'])],
      attbekr: () => ['Ska bekräftas', 'Bekräftelsen öppnar två arbetsdagar före mötet.', mr(A.attbekr, ['Att bekräfta', 'varn'])],
      utantid: () => ['Uteblivna utan ny tid', 'Kunden uteblev och inget nytt möte är bokat.', kr(A.utantid, ['Ingen ny tid', 'fara'])],
      uppfnu: () => ['Uppföljningar att ringa', 'Uppföljningsdagen är i dag eller har passerat.', kr(A.uppfnu, k => k.uppf < this.dag(this.NU) ? ['Försenad', 'fara'] : ['I dag', 'varn'])],
      utan: () => ['Utfall saknas', 'Mötestiden har passerat men säljaren har inte satt något utfall.', mr(A.utan, ['Utfall saknas', 'varn'])],
      kommer: () => ['Bokade framåt', 'Möten som inte har varit än.', mr(A.kommer)]
    }[key];
    if (!L) return null;
    // Listorna bakom Att göra nu börjar med det som brådskar: närmast möte, äldsta uppföljning.
    // Historiken bakom ett tal börjar med det senaste.
    const fram = { attbekr: 't', utan: 't', utantid: 't', kommer: 't', uppfnu: 'u', svarnu: 'u' }[key];
    const l = L(), rader = l[2].sort(fram ? (a, b) => (a[fram] < b[fram] ? -1 : a[fram] > b[fram] ? 1 : 0) : (a, b) => (a.t < b.t ? 1 : -1));
    // Under rubriken: hur raderna fördelar sig, i stället för bara hur många de är.
    const grupper = [];
    rader.forEach(r => { const g = grupper.find(x => x[0] === r.pill); if (g) g[1]++; else grupper.push([r.pill, 1]); });
    const kort = ['offert', 'nytt', 'vantar', 'dog', 'closing', 'svarnu', 'utantid', 'uppfnu'].includes(key);
    const antal = !rader.length ? '' : grupper.length > 1 ? grupper.sort((a, b) => b[1] - a[1]).map(g => g[0] + ' ' + g[1]).join(' · ')
      : rader.length + ' ' + (kort ? 'kort' : rader.length === 1 ? 'möte' : 'möten');
    return { titel: l[0], fork: l[1].trim(), rader, antal, tom: rader.length === 0 };
  }

  /* ---------- Det som mallen läser ---------- */
  renderVals() {
    this.init();
    const st = this.st, P = this.perioder(), p = P[st.period] || P.d90, pers = st.pers;
    const S = this.stat(p.fran, p.till, pers), F0 = p.pf ? this.stat(p.pf, p.pt, pers) : null;
    const { moten, kedjor } = this.data(), nu = this.NU, idag = this.dag(nu);
    const hos = (m) => !pers || m.bokare === pers || m.hallare === pers;
    const pct = (n, av) => av ? Math.round(n / av * 100) : 0;
    const w = (n, av) => (av ? Math.max(n ? 2 : 0, n / av * 100) : 0).toFixed(2) + '%';
    const ord = (n, en, fl) => n + ' ' + (n === 1 ? en : fl);
    // Jämförelsen visas bara när båda perioderna har minst fem att räkna på. Under det är procenten brus.
    const jf = (n, av, n0, av0) => {
      if (!F0 || av < 5 || av0 < 5) return null;
      const a = pct(n, av), b = pct(n0, av0);
      return { rad: (a === b ? 'Samma som ' : (a > b ? 'Upp från ' : 'Ned från ') + b + ' % ') + p.mot, fore: b };
    };
    // Ett stort tal: procent när underlaget är minst fem, annars "2 av 3". Tomt underlag visar ett streck.
    const tal = (key, namn, n, av, vad, tomt, kl) => Object.assign(
      av === 0 ? { v: '–', pz: '', s: tomt, cls: kl + ' tom' }
        : av >= 5 ? { v: String(this.v(key + 'p', pct(n, av))), pz: '%', s: this.v(key + 'n', n) + ' av ' + this.v(key + 'a', av) + ' ' + vad, cls: kl }
          : { v: this.v(key + 'n', n) + ' av ' + this.v(key + 'a', av), pz: '', s: vad, cls: kl + ' txt' },
      { w: w(n, av), not: '', pick: this.oppna(key), aria: namn + ': ' + (av === 0 ? (tomt || 'inget att räkna på än') : (av >= 5 ? pct(n, av) + ' procent, ' : '') + n + ' av ' + av + ' ' + vad) + '. Visa listan' });

    const nH = S.hallna.length, nA = S.avgj.length, nK = S.K1.length, nO = S.off.length, ob = S.obekr;
    const obH = ob.filter(m => m.utfall === 'h').length, bkH = S.svarade.filter(m => m.utfall === 'h').length;

    /* Rubriken: det talen inte visar. Annars hur många som gått till offert. */
    let ins1 = '';
    if (ob.length >= 2 && S.svarade.length >= 2) {
      if (obH === 0) ins1 = 'Inget av de ' + ob.length + ' obekräftade mötena blev av.';
      else if (pct(bkH, S.svarade.length) - pct(obH, ob.length) >= 15) ins1 = 'Bekräftade möten blev av ' + bkH + ' av ' + S.svarade.length + ' gånger, obekräftade ' + obH + ' av ' + ob.length + '.';
    }
    if (!ins1) ins1 = nK ? (nO ? nO + ' av ' + ord(nK, 'hållet möte', 'hållna möten') + ' har gått till offert.' : 'Inget möte har gått till offert än.') : nA ? 'Inget möte blev av i perioden.' : S.F.length ? 'Inget av de bokade mötena har varit än.' : 'Inga möten i perioden.';
    const ins2 = !S.F.length && st.period !== 'allt' ? 'Välj en längre period för att se mer.' : '';

    /* Navet: show rate, och mötena ett och ett i tidsordning */
    const jamfor = {
      show: jf(nH, nA, F0 ? F0.hallna.length : 0, F0 ? F0.avgj.length : 0),
      bekr: jf(S.svarade.length, nA, F0 ? F0.svarade.length : 0, F0 ? F0.avgj.length : 0),
      kval: jf(S.kval.length, nH, F0 ? F0.kval.length : 0, F0 ? F0.hallna.length : 0),
      offert: jf(nO, nK, F0 ? F0.off.length : 0, F0 ? F0.K1.length : 0),
      closing: jf(S.affar.length, S.affar.length + S.nej.length, F0 ? F0.affar.length : 0, F0 ? F0.affar.length + F0.nej.length : 0)
    };
    const show = tal('show', 'Show rate', nH, nA, 'kom', 'Inget att räkna på än', 'hv');
    show.jf = jamfor.show ? jamfor.show.rad : '';
    // Tom period: navet säger vad som väntar i stället för bara ett streck, och öppnar de bokade mötena.
    const kommer = moten.filter(m => m.art !== 'u' && hos(m) && !m.utfall && m.tid > nu).sort((a, b) => a.tid < b.tid ? -1 : 1);
    if (!nA && kommer.length) {
      const nasta = 'Nästa möte ' + this.svDag(kommer[0].tid, true);
      Object.assign(show, { s: nasta, jf: ord(kommer.length, 'möte bokat framåt', 'möten bokade framåt'), pick: this.oppna('kommer'),
        aria: 'Show rate: inget möte har varit än. ' + nasta + ', ' + ord(kommer.length, 'möte bokat', 'möten bokade') + '. Visa listan' });
    }
    const sista = S.avgj.slice().sort((a, b) => a.tid < b.tid ? -1 : 1).slice(-40);
    const remsa = sista.map((m, j) => ({ cls: m.utfall === 'h' ? 'k' : 'u', title: this.svDag(m.tid, false) + ': ' + (m.utfall === 'h' ? 'kom' : 'uteblev'), delay: 250 + j * (sista.length > 20 ? 12 : 30) + 'ms' }));

    /* Rutorna */
    const noshow = tal('uteblev', 'No-show rate', S.uteblev.length, nA, 'uteblev', '', 'rv');
    const bekr = tal('bekr', 'Svarade på bekräftelsen', S.svarade.length, nA, 'svarade', '', 'rv');
    if (nA) bekr.not = S.ejsvar.length + ' svarade inte · ' + S.aldrig.length + ' ringdes aldrig';
    const utanBed = nH - S.bedomda.length;
    // Räknas på alla hållna (beställaren 2026-11-15): ett obedömt möte är inte kvalificerat, och talet och mätaren säger samma sak.
    const kval = tal('kval', 'Kvalificerade', S.kval.length, nH, 'hållna möten', '', 'rv');
    if (utanBed > 0) kval.not = utanBed === 1 ? '1 hållet saknar bedömning' : utanBed + ' hållna saknar bedömning';
    const avgjO = S.affar.length + S.nej.length;
    const ejAvgj = S.svar.length + S.tyst.length;
    const clo = tal('closing', 'Closing rate', S.affar.length, avgjO, 'avgjorda blev affär', !nO ? (nK ? 'Ingen offert skickad än' : '') : nO === 1 ? '1 offert, inte avgjord än' : 'Ingen av ' + nO + ' offerter avgjord än', 'rv');
    if (avgjO && ejAvgj) clo.not = ejAvgj === 1 ? '1 offert inte avgjord än' : ejAvgj + ' offerter inte avgjorda än';

    /* Efter första mötet: vad varje hållet möte har lett till */
    const eft = [['Till offert', S.off, 'ok', 'offert'], ['Nytt möte', S.nytt, 'ok2', 'nytt'], ['Följs upp', S.vantar, 'varn', 'vantar'], ['Dog', S.dog, 'fara', 'dog']].map((x, j) => ({
      l: x[0], n: this.v('e' + x[3], x[1].length), ton: x[2], dot: 'dot ' + x[2], w: w(x[1].length, nK), cls: (j ? 'ec' : 'ec forst') + (x[1].length ? '' : ' noll'), pick: this.oppna(x[3]), esCls: j ? 'es tomrad' : 'es',
      sub: j ? '' : nK ? (nK >= 5 ? pct(nO, nK) + '\u00a0% ' : '') + 'av ' + ord(nK, 'hållet', 'hållna') : 'Inget möte hållet än',
      aria: x[0] + ': ' + x[1].length + ' av ' + ord(nK, 'hållet möte', 'hållna möten') + '. Visa korten'
    }));

    /* Att göra nu: läget i dag, oavsett period */
    const attbekr = moten.filter(m => m.art !== 'u' && hos(m) && !m.utfall && m.tid > nu && !m.bekr && this.arbetsdagFore(this.dag(m.tid), 2) <= idag).sort((a, b) => a.tid < b.tid ? -1 : 1);
    const utantid = kedjor.filter(k => k.uteblev && hos(k.uteblev) && !k.ombokad && !k.avslut && !k.forsta);
    const utan = moten.filter(m => hos(m) && !m.utfall && m.tid <= nu);
    const uppfnu = kedjor.filter(k => k.forsta && hos(k.forsta) && !k.avslut && !k.natt && !k.oppet && k.tyst < 3 && k.uppf && k.uppf <= idag);
    const offsvar = kedjor.filter(k => k.slut === 'svar' && hos(k.forsta));
    const A = { attbekr, utantid, uppfnu, utan, offsvar, kommer };
    const rad = (a, en, fl, sub, ton, key) => a.length ? [{ n: a.length, text: a.length === 1 ? en : fl, sub, ton: 'dot ' + ton, pick: this.oppna(key) }] : [];
    const sena = (a) => a.filter(k => k.uppf && k.uppf < idag).length;
    const forsenat = (a) => { const s = sena(a); return !s ? '' : s === a.length && s > 1 ? 'Alla skulle ha följts upp' : s + ' skulle ha följts upp'; };
    const nasta = offsvar.map(k => k.uppf).filter(Boolean).sort()[0];
    const todo = rad(attbekr, 'möte ska bekräftas', 'möten ska bekräftas', attbekr.length ? 'Närmast ' + this.svDag(attbekr[0].tid, true) : '', 'varn', 'attbekr')
      .concat(rad(utantid, 'utebliven utan ny tid', 'uteblivna utan ny tid', forsenat(utantid) || 'Ingen uppföljning försenad', 'fara', 'utantid'))
      .concat(rad(uppfnu, 'uppföljning att ringa', 'uppföljningar att ringa', sena(uppfnu) ? sena(uppfnu) + (sena(uppfnu) === 1 ? ' är försenad' : ' är försenade') : 'I dag', sena(uppfnu) ? 'fara' : 'varn', 'uppfnu'))
      .concat(rad(utan, 'möte saknar utfall', 'möten saknar utfall', 'Mötestiden har passerat', 'varn', 'utan'))
      .concat(rad(offsvar, 'offert väntar på svar', 'offerter väntar på svar', forsenat(offsvar) || (nasta ? 'Följs upp ' + this.svDag(nasta, false) : 'Ingen uppföljning satt'), sena(offsvar) ? 'fara' : 'vag', 'svarnu'));

    const namn = [...new Set(moten.flatMap(m => [m.bokare, m.hallare]))].sort((a, b) => a.localeCompare(b, 'sv'));
    const o = st.open ? this.lista(st.open, S, A) : null;
    // Jämförelsen med perioden före står i listan bakom talet, inte i rutan.
    if (o && jamfor[st.open]) o.fork += ' ' + { show: 'Show rate', bekr: 'Svarade', kval: 'Kvalificerade', offert: 'Till offert', closing: 'Closing rate' }[st.open] + ' ' + p.mot + ': ' + jamfor[st.open].fore + ' %.';
    const morkt = !!(this.props || {}).morkt;
    return {
      rot: morkt ? 'sida dark' : 'sida',
      ins1, ins2,
      personer: [{ l: 'Alla', tryckt: String(!pers), pick: () => this.byt({ pers: null }) }].concat(namn.map(n => ({ l: n, tryckt: String(pers === n), pick: () => this.byt({ pers: n }) }))),
      perioder: Object.keys(P).map(k => ({ l: P[k].l, tryckt: String(k === st.period), tip: P[k].till === null ? (k === 'allt' ? 'Allt sedan första bokningen' : 'Mötesdag från ' + this.kortDag(P[k].fran)) + ', plus det som är bokat framåt' : 'Mötesdag ' + this.kortDag(P[k].fran) + ' till ' + this.kortDag(P[k].till), pick: () => this.byt({ period: k }) })),
      show, remsa, harRemsa: remsa.length > 0, remsaText: nA > 40 ? 'De 40 senaste, möte för möte' : 'Möte för möte, äldst till vänster',
      noshow, bekr, kval, clo, eft,
      todo, lugnt: todo.length === 0,
      fot: (this.ex ? 'Exempeldata.' : 'Era siffror lördag 14 nov.') + ' Bolagsnamnen i listorna är påhittade.',
      egTryckt: String(!this.ex), exTryckt: String(this.ex),
      visaEgna: () => this.byt({ underlag: 'Era siffror', pers: null }), visaEx: () => this.byt({ underlag: 'Exempel: ett halvår', pers: null }),
      blad: o || { titel: '', fork: '', rader: [], antal: '', tom: false }, bladOppet: !!o, stang: () => this.stang(),
      bladTangent: (e) => {
        if (!e) return;
        if (e.key === 'Escape') { e.stopPropagation(); this.stang(); }
        // Bladet har en enda knapp. Tab stannar på den i stället för att gå ut bakom bladet.
        else if (e.key === 'Tab' && typeof document !== 'undefined') { e.preventDefault(); const x = document.querySelector('.blad .bx'); if (x) x.focus(); }
      }
    };
  }
}
</script>
